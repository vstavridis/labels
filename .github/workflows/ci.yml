name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,ai,google]"
      # Reference files are confidential and not in the repository, so the
      # real-file tests are skipped here; run them locally (docs/TESTING.md).
      - run: python -m pytest -q -rs

  cloud-postgres:
    name: whole suite on PostgreSQL (cloud database + barcode registry)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vspm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VSPM_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/vspm_test
      VSPM_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vspm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,ai,google,registry,cloud]"
      - run: python -m pytest -q -rs --ignore=tests/browser

  streamlit-cloud:
    # Same as Streamlit Community Cloud: Python 3.12, ONLY requirements.txt installed (not the package),
    # `streamlit run src/vspm/ui/app.py` from the repository root, PostgreSQL database.
    name: Streamlit Cloud deployment (requirements.txt only, Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vspm_deploy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Main file and component files exist
        run: |
          for f in src/vspm/ui/app.py requirements.txt .streamlit/config.toml \
                   src/vspm/ui/dymo_bridge/static/index.html src/vspm/ui/dymo_bridge/static/bridge.js \
                   src/vspm/ui/dymo_bridge/static/vendor/dymo.connect.framework.js; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_cloud_deploy.py --database-url postgresql://postgres:postgres@localhost:5432/vspm_deploy

  browser-dymo:
    # Browser-side DYMO printing against a fake DYMO Web Service on https://127.0.0.1:41951,
    # with the app origin treated as a PUBLIC address (Local Network Access rules of the cloud).
    name: browser printing (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "Chromium, Linux", os: ubuntu-latest, channel: ""}
          - {name: "Chrome, Windows", os: windows-latest, channel: chrome}
          - {name: "Edge, Windows", os: windows-latest, channel: msedge}
    env:
      VSPM_TEST_BROWSER_CHANNEL: ${{ matrix.channel }}
      VSPM_REQUIRE_BROWSER: "1"  # a missing browser fails the job instead of skipping the tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" playwright
      - name: Bundled Chromium (Linux only; Windows uses the installed Chrome / Edge)
        if: matrix.channel == ''
        run: python -m playwright install --with-deps chromium
      - name: Browser versions
        shell: bash
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(channel=os.environ.get("VSPM_TEST_BROWSER_CHANNEL") or None)
              print("browser:", os.environ.get("VSPM_TEST_BROWSER_CHANNEL") or "bundled chromium", b.version)
              b.close()
          PY
      - run: python -m pytest -q -rs tests/browser tests/test_browser_print.py

  windows-install:
    name: Windows installation and launch
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      # The confidential templates are not in the repository: use the sanitized fixtures.
      VSPM_TEMPLATE_DIR: tests/fixtures/labels
      VSPM_PRINTER_MODE: mock
      VSPM_DRIVE_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the Windows setup script (as an employee would)
        run: powershell -ExecutionPolicy Bypass -File scripts\setup_windows.ps1
      - name: vspm check
        run: .\.venv\Scripts\vspm.exe check
      - name: DYMO template test (mock printer, templates must stay unchanged)
        run: .\.venv\Scripts\vspm.exe dymo-test --print
      - name: Pilot dry run (synthetic workbook)
        run: .\.venv\Scripts\vspm.exe pilot-dryrun --synthetic
      - name: Start the app with start_vspm.bat and check it serves pages
        run: |
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "scripts\start_vspm.bat" -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:8501/_stcore/health" -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          $page = Invoke-WebRequest -Uri "http://localhost:8501/" -UseBasicParsing
          Write-Host "health ok: $ok  page status: $($page.StatusCode)"
          taskkill /PID $p.Id /T /F 2>&1 | Out-Null  # some children may already have exited: not an error
          if (-not $ok) { throw "Streamlit did not start" }
          exit 0
