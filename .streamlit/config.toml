# Used locally and on Streamlit Community Cloud (must stay at the repository root).
[server]
headless = true
maxUploadSize = 50          # MB: scans, .label templates, workbook copies for reconciliation
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"     # employees do not need the developer menu
showErrorDetails = "type"   # no stack traces (paths, SQL) shown to users
