[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vs-production-manager"
version = "0.1.0"
description = "VS Production Manager: handwritten production orders -> DYMO labels -> Excel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "lxml>=5.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "streamlit>=1.50,<2",
    "pandas>=2.0",
    "pypdfium2>=4.30",
    "typer>=0.12",
    "tzdata>=2024.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
ai = ["anthropic>=0.70"]
google = [
    "google-api-python-client>=2.100",
    "google-auth>=2.25",
    "google-auth-oauthlib>=1.2",
]
windows = ["pywin32>=306; sys_platform == 'win32'"]
registry = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]
cloud = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "Authlib>=1.3.2",
    "cryptography>=42",
]
dev = ["pytest>=8.0", "cryptography>=42", "psycopg[binary]>=3.1", "psycopg-pool>=3.2", "Authlib>=1.3.2", "fastapi>=0.110", "sqlalchemy>=2.0", "httpx>=0.27", "uvicorn>=0.29"]

[project.scripts]
vspm = "vspm.cli:app"
vspm-registry = "vspm_registry.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vspm" = ["db/migrations/*.sql"]
"vspm_registry" = ["migrations/*.sql", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
