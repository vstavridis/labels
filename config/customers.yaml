# Seed customer rules, imported into the local database the first time the
# app starts. Afterwards edit them on the Settings page (or re-import).
#
# Lower priority numbers are evaluated first. The first matching rule that
# names a template decides the label type; the first matching rule with a
# short_name decides the name printed on the label / written to Excel.
#
# match: exact | contains | regex  (comparison ignores case, accents,
#        punctuation and Greek/Latin look-alike letters)
#
# Only rules given in the project brief are seeded here. Use
#   vspm suggest-customers --workbook <copy of Σχισμενα.xlsx>
# to list customer -> category history from the workbook and review it
# before adding rules (real customer lists are not committed to git).

rules:
  - priority: 10
    match: exact
    pattern: "ΚΥΡΙΑΚΙΔΗΣ"
    template: PG0
    short_name: "ΚΥΡΙΑΚΙΔΗΣ"
    notes: "From brief: ΚΥΡΙΑΚΙΔΗΣ -> PG0 (Excel category PG)"

  - priority: 20
    match: exact
    pattern: "ΓΚΟΥΝΤΑ - ΠΑΓΟΥΝΗ"
    template: PG
    short_name: "ΓΚΟΥΝΤΑ"
    notes: "From brief. Short name taken from the brief's label example."

  - priority: 30
    match: contains
    pattern: "ΠΑΓΟΥΝΗ"
    template: PG
    requires_confirmation: true
    notes: "Other names containing ΠΑΓΟΥΝΗ: PG suggested, operator confirms."
