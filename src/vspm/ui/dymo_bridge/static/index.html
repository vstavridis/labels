<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<title>VSPM DYMO bridge</title>
<style>
  :root { --ok: #17602f; --okbg: #e5f5ea; --bad: #9b1c1c; --badbg: #fdecec; --warnbg: #fff4e0; --fg: #1d2330; }
  body { font-family: "Source Sans Pro", "Segoe UI", Arial, sans-serif; color: var(--fg); margin: 0; padding: 2px 2px 6px; font-size: 15px; }
  .line { padding: 6px 10px; border-radius: 6px; margin: 4px 0; font-weight: 600; }
  .line.ok { background: var(--okbg); color: var(--ok); }
  .line.bad { background: var(--badbg); color: var(--bad); }
  .line.wait { background: #eef2f8; color: #1f3b63; }
  .hint { background: var(--warnbg); padding: 6px 10px; border-radius: 6px; margin: 4px 0; font-size: 14px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  label { font-weight: 600; }
  select, input { font-size: 15px; padding: 5px 8px; border: 1px solid #c8ced8; border-radius: 6px; min-width: 260px; }
  button { font-size: 15px; padding: 6px 14px; border-radius: 6px; border: 1px solid #c8ced8; background: #fff; cursor: pointer; }
  button.primary { background: #ff4b4b; color: #fff; border-color: #ff4b4b; }
  .job { border: 1px solid #c8ced8; border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
  .job.submitted { background: var(--okbg); border-color: #9fd3ae; }
  .job.failed, .job.rejected, .job.not_submitted { background: var(--badbg); border-color: #f0b4b4; }
  .job.uncertain, .job.printing { background: var(--warnbg); }
  .jobtitle { font-weight: 700; margin-bottom: 4px; }
  .problem { color: var(--bad); font-size: 14px; }
  pre { white-space: pre-wrap; font-size: 12px; background: #f6f7f9; padding: 6px; border-radius: 6px; }
</style>
<!-- DYMO's official framework (MIT), served by this app: vendor/README.md -->
<script src="vendor/dymo.connect.framework.js"></script>
</head>
<body>
<div id="root"></div>
<script src="bridge.js"></script>
</body>
</html>
